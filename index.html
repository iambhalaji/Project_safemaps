<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Safe Maps — Secure Municipal Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 15% 0%, rgba(14, 165, 233, 0.08) 0px, transparent 45%),
        radial-gradient(at 85% 10%, rgba(99, 102, 241, 0.06) 0px, transparent 45%);
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      letter-spacing: -0.015em;
    }
    .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: -0.02em; }
    .light-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04), 0 2px 6px -1px rgba(15, 23, 42, 0.02);
      border-radius: 14px;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="light-card w-full max-w-md p-8 shadow-2xl border border-slate-200/80 bg-white/95">
    
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-sky-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/25 font-extrabold text-white text-2xl mx-auto mb-4">
        SM
      </div>
      <h2 class="text-2xl font-extrabold tracking-tight text-slate-900">Project Safe Maps</h2>
      <p class="text-xs text-slate-500 mt-1 font-medium">Municipal Spatial Safety & Risk Intelligence Portal</p>
    </div>

    <!-- Login Form -->
    <form action="dashboard.html" method="GET" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Authorized Officer ID</label>
        <input type="text" value="admin_safe_maps" required class="w-full light-card px-4 py-3 text-sm font-medium text-slate-800 outline-none border border-slate-200 focus:border-sky-500">
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-600">Secure Access Key</label>
          <span class="text-[11px] text-sky-600 font-semibold">Demo Bypass Enabled</span>
        </div>
        <input type="password" value="datathon2026" required class="w-full light-card px-4 py-3 text-sm font-medium text-slate-800 outline-none border border-slate-200 focus:border-sky-500">
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-700 hover:to-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-sky-500/25 transition transform active:scale-[0.98]">
          Authenticate & Launch Dashboard →
        </button>
      </div>
    </form>

    <!-- Footer Help -->
    <div class="mt-6 pt-5 border-t border-slate-100 text-center">
      <p class="text-[11px] text-slate-500 font-medium">
        Connected to <span class="mono text-slate-700 font-semibold">1,000 Locations</span> × <span class="mono text-slate-700 font-semibold">18,000 Logs</span>
      </p>
    </div>
  </div>

</body>
</html>
